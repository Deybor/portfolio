<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842" style="max-width:100%;height:auto"><title>Iced-out ring / Costing, MOQ &amp; supplier quotation</title><rect width="1190" height="842" fill="white"/><rect x="0" y="0" width="1190" height="62" fill="#202b32"/><text x="36" y="27" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">ICED-OUT RING / TECHNICAL SPECIFICATION</text><text x="36" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="start">Adesina Adebola / independent jewellery design study</text><text x="1154" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">IO-R01 / SPEC A</text><text x="1154" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="end">SHEET 07 / 08</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#202b32" text-anchor="start">Costing, MOQ &amp; supplier quotation</text><text x="36" y="130.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Quotation requirements and proposed order tiers.</text><rect x="36" y="165" width="1118" height="30" fill="#202b32"/><text x="46" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Commercial field</text><text x="291.96000000000004" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Required value</text><text x="660.9000000000001" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Supplier response detail</text><rect x="36" y="195" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Target unit cost</text><text x="291.96000000000004" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC in NGN per complete ring</text><text x="660.9000000000001" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Confirm the design budget and supplier quotation.</text><path d="M36 228.015 L1154 228.015" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">MOQ / size split</text><text x="291.96000000000004" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC per design / finish / size</text><text x="660.9000000000001" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Supplier to state minimum order, per-size minimum and mixed-size allowance.</text><path d="M36 261.03 L1154 261.03" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="261.03" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="280.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Quote tiers</text><text x="291.96000000000004" y="280.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">50 / 100 / 250 rings requested for comparison</text><text x="660.9000000000001" y="280.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Inquiry quantities only. Separate prototype quantity and cost.</text><path d="M36 294.04499999999996 L1154 294.04499999999996" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="313.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Tooling / mold / 3D modelling fees</text><text x="291.96000000000004" y="313.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC; currency and ownership stated</text><text x="660.9000000000001" y="313.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Separate one-time charges, tooling life, correction charges and repeat-order rights.</text><path d="M36 327.05999999999995 L1154 327.05999999999995" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="327.05999999999995" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="346.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Metal / stones / setting</text><text x="291.96000000000004" y="346.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC, each separated</text><text x="660.9000000000001" y="346.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Declare metal weight basis, stone unit costs, setting labour and material wastage.</text><path d="M36 360.07499999999993 L1154 360.07499999999993" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="379.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Polish / coating / QC / packing</text><text x="291.96000000000004" y="379.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC, each separated</text><text x="660.9000000000001" y="379.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Declare coating stack and thickness, test/report costs and packing inclusion.</text><path d="M36 393.0899999999999 L1154 393.0899999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="393.0899999999999" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="412.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Lead time</text><text x="291.96000000000004" y="412.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC: Model approval, tooling, sample, correction, production</text><text x="660.9000000000001" y="412.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">State calendar days and the approval/payment trigger for each stage.</text><path d="M36 426.1049999999999 L1154 426.1049999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="445.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Freight / taxes / payment</text><text x="291.96000000000004" y="445.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC; Incoterm and destination required</text><text x="660.9000000000001" y="445.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">State quote currency, validity, exchange-rate basis, deposit and balance terms.</text><path d="M36 459.1199999999999 L1154 459.1199999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="459.1199999999999" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="478.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Defect / rework terms</text><text x="291.96000000000004" y="478.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC; written before purchase order</text><text x="660.9000000000001" y="478.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Agree critical defect response, remake/rework costs and claim period.</text><path d="M36 492.1349999999999 L1154 492.1349999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="511.6349999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Model metal volume</text><text x="291.96000000000004" y="511.6349999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">156.91 mm³</text><text x="660.9000000000001" y="511.6349999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Supplier to confirm finished metal weight and process yield.</text><path d="M36 525.1499999999999 L1154 525.1499999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="561.1499999999999" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Landed unit cost = metal + stones + setting + finish/coating + QC + packing + allocated tooling + freight/taxes. Record quote date and currency. Compare suppliers only after material, size, stone count, coating and quality</text><text x="36" y="576.8799999999999" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">requirements match.</text><path d="M36 789 L1154 789" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="810" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#53646c" text-anchor="start">02 OCT 2026 / Dimensions in mm / not to scale</text><text x="1154" y="810" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#202b32" text-anchor="end">IO-R01 / SPEC A / 07</text></svg>