<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842" style="max-width:100%;height:auto"><title>Confluence / Sample review &amp; quality control</title><rect width="1190" height="842" fill="white"/><rect x="0" y="0" width="1190" height="62" fill="#202b32"/><text x="36" y="27" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">CONFLUENCE / TECHNICAL SPECIFICATION</text><text x="36" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="start">Adesina Adebola / independent jewellery design study</text><text x="1154" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">CF-R01 / SPEC C</text><text x="1154" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="end">SHEET 06 / 08</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#202b32" text-anchor="start">Sample review &amp; quality control</text><text x="36" y="130.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">First-article inspection criteria and records.</text><rect x="36" y="165" width="1118" height="30" fill="#202b32"/><text x="46" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Check</text><text x="213.7" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Acceptance criterion</text><text x="560.28" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Method / record</text><text x="996.3" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Classification</text><rect x="36" y="195" width="1118" height="48.03" fill="#f1f4f4"/><text x="46" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q01 / identity</text><text x="213.7" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Alloy and stone identity match approved BOM</text><text x="560.28" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Supplier certificates + suitable material/stone verification; coating can affect surface</text><text x="560.28" y="229.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">readings.</text><text x="996.3" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Reject substitution</text><path d="M36 243.03 L1154 243.03" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="262.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q02 / size</text><text x="213.7" y="262.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Bore and envelopes within agreed finished targets</text><text x="560.28" y="262.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Calibrated gauges; multiple orientations; record measured values and equipment.</text><text x="996.3" y="262.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Major</text><path d="M36 276.045 L1154 276.045" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="276.045" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="295.545" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q03 / setting</text><text x="213.7" y="295.545" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">All 3 stones present; level seating; no movement or chipped girdles</text><text x="560.28" y="295.545" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Inspect every stone under magnification; retention test method/load TBC with setter.</text><text x="996.3" y="295.545" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Critical if loose/missing</text><path d="M36 309.06 L1154 309.06" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="328.56" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q04 / prongs</text><text x="213.7" y="328.56" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Rounded consistent tips; contour-matched bearings; sufficient metal</text><text x="560.28" y="328.56" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Inspect every bearing, stone contact and prong tip under magnification.</text><text x="996.3" y="328.56" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Major</text><path d="M36 342.075 L1154 342.075" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="342.075" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="361.575" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q05 / surface</text><text x="213.7" y="361.575" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">No burrs, sharp points, visible pits or blocked galleries</text><text x="560.28" y="361.575" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Visual master comparison and snag check.</text><text x="996.3" y="361.575" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Major / minor by zone</text><path d="M36 375.09 L1154 375.09" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="394.59" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q06 / coating</text><text x="213.7" y="394.59" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Approved thickness, colour and coverage on significant surfaces</text><text x="560.28" y="394.59" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Calibrated local XRF check at outer shank, inner bore and accessible setting; sites</text><text x="560.28" y="409.60499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">agreed with supplier.</text><text x="996.3" y="394.59" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Major</text><path d="M36 423.12 L1154 423.12" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="423.12" width="1118" height="48.03" fill="#f1f4f4"/><text x="46" y="442.62" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q07 / durability</text><text x="213.7" y="442.62" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Retention, finish wear and skin-contact performance validated</text><text x="560.28" y="442.62" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Supplier to propose quantified wear, sweat and adhesion protocols, limits and reports</text><text x="560.28" y="457.635" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">before testing.</text><text x="996.3" y="442.62" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Release gate</text><path d="M36 471.15 L1154 471.15" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="490.65" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q08 / stacking</text><text x="213.7" y="490.65" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">No stone-to-metal rubbing; comfortable fit and removal</text><text x="560.28" y="490.65" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Wear trial with selected partner rings; photograph clearances and record actual sizes.</text><text x="996.3" y="490.65" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Release gate</text><path d="M36 504.16499999999996 L1154 504.16499999999996" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="504.16499999999996" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="523.665" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Q09 / packaging</text><text x="213.7" y="523.665" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">No transit abrasion; correct item/size/material labelling</text><text x="560.28" y="523.665" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Sample pack and transit handling check; stones protected independently.</text><text x="996.3" y="523.665" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Major</text><path d="M36 537.18 L1154 537.18" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="570.18" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Defect log fields: sample ID, date, sheet/feature ID, measured result, photograph, severity, cause, correction owner, due date and recheck result. Reject critical faults; batch sampling plan and major/minor acceptance limits remain</text><text x="36" y="585.91" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">TBC.</text><path d="M36 789 L1154 789" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="810" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#53646c" text-anchor="start">02 OCT 2026 / Dimensions in mm / not to scale</text><text x="1154" y="810" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#202b32" text-anchor="end">CF-R01 / SPEC C / 06</text></svg>