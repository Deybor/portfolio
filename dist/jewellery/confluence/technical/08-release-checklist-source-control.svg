<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842" style="max-width:100%;height:auto"><title>Confluence / Sample approval &amp; release</title><rect width="1190" height="842" fill="white"/><rect x="0" y="0" width="1190" height="62" fill="#202b32"/><text x="36" y="27" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">CONFLUENCE / TECHNICAL SPECIFICATION</text><text x="36" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="start">Adesina Adebola / independent jewellery design study</text><text x="1154" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">CF-R01 / SPEC C</text><text x="1154" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="end">SHEET 08 / 08</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#202b32" text-anchor="start">Sample approval &amp; release</text><text x="36" y="130.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Open specifications and first-sample approval requirements.</text><rect x="36" y="165" width="1118" height="30" fill="#202b32"/><text x="46" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Item</text><text x="247.23999999999998" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Specification / status</text><text x="694.44" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Approval requirement</text><rect x="36" y="195" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Drawing revision</text><text x="247.23999999999998" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">CF-R01 / SPEC C</text><text x="694.44" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Approve the casting master and finished dimensions before tooling.</text><path d="M36 228.015 L1154 228.015" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Metal body</text><text x="247.23999999999998" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">21.42 W × 23.08 H × 6.00 D mm</text><text x="694.44" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Confirm finished wall, gallery and prong thicknesses.</text><path d="M36 261.03 L1154 261.03" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="261.03" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="280.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Ring size / units</text><text x="247.23999999999998" y="280.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">18.00 mm nominal bore</text><text x="694.44" y="280.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Confirm nominal ring size and check the finished bore with calibrated gauges.</text><path d="M36 294.04499999999996 L1154 294.04499999999996" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="313.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Materials / stones</text><text x="247.23999999999998" y="313.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">925 silver / 18K plate / moissanite proposed</text><text x="694.44" y="313.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Approve alloy, coating stack, stone grades, profiles and dimensional range.</text><path d="M36 327.05999999999995 L1154 327.05999999999995" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="327.05999999999995" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="346.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Sample status</text><text x="247.23999999999998" y="346.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">First article TBC</text><text x="694.44" y="346.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Approve setting, finish, fit and inspection results.</text><path d="M36 360.07499999999993 L1154 360.07499999999993" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="379.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Stack / collection role</text><text x="247.23999999999998" y="379.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Three-stone focal ring; trial beside a plain slender band</text><text x="694.44" y="379.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Confirm partner-ring clearance and fit in a wear trial.</text><path d="M36 393.0899999999999 L1154 393.0899999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="393.0899999999999" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="412.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Size range / resizing</text><text x="247.23999999999998" y="412.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Size range TBC; evaluate lower-shank resizing with supplier</text><text x="694.44" y="412.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Do not scale stone geometry uniformly; retain purchased stone sizes and reassess settings.</text><path d="M36 426.1049999999999 L1154 426.1049999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="445.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">Release approval</text><text x="247.23999999999998" y="445.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Designer: TBC / supplier: TBC / sample ID: TBC</text><text x="694.44" y="445.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Production release requires signed sample approval.</text><path d="M36 459.1199999999999 L1154 459.1199999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="491.1199999999999" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8b7250" text-anchor="start">APPROVAL RECORD</text><rect x="36" y="505.1199999999999" width="1118" height="30" fill="#202b32"/><text x="46" y="525.1199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Sample ID</text><text x="325.5" y="525.1199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Inspection date</text><text x="605.0" y="525.1199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Designer approval</text><text x="884.5" y="525.1199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Supplier approval</text><rect x="36" y="535.1199999999999" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="554.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">TBC</text><text x="325.5" y="554.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC</text><text x="605.0" y="554.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC</text><text x="884.5" y="554.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">TBC</text><path d="M36 568.1349999999999 L1154 568.1349999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><path d="M36 789 L1154 789" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="810" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#53646c" text-anchor="start">02 OCT 2026 / Sample approval pending / NOT RELEASED FOR PRODUCTION</text><text x="1154" y="810" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#202b32" text-anchor="end">CF-R01 / SPEC C / 08</text></svg>