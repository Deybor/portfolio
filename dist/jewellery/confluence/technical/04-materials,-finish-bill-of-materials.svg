<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842" style="max-width:100%;height:auto"><title>Confluence / Materials, finish &amp; bill of materials</title><rect width="1190" height="842" fill="white"/><rect x="0" y="0" width="1190" height="62" fill="#202b32"/><text x="36" y="27" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">CONFLUENCE / TECHNICAL SPECIFICATION</text><text x="36" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="start">Adesina Adebola / independent jewellery design study</text><text x="1154" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">CF-R01 / SPEC C</text><text x="1154" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="end">SHEET 04 / 08</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#202b32" text-anchor="start">Materials, finish &amp; bill of materials</text><text x="36" y="130.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Proposed alloy, stone, coating and surface specifications.</text><rect x="36" y="165" width="1118" height="30" fill="#202b32"/><text x="46" y="185" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">BOM / field</text><text x="269.6" y="185" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">Specification</text><text x="660.9" y="185" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="start">Acceptance / status</text><rect x="36" y="195" width="1118" height="33.73" fill="#f1f4f4"/><text x="46" y="215.0" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">M01 / body</text><text x="269.6" y="215.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">925 sterling silver; one-piece investment casting</text><text x="660.9" y="215.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Proposed. Supplier alloy certificate and casting suitability required.</text><path d="M36 228.73 L1154 228.73" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="248.73" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">M02 / gold layer</text><text x="269.6" y="248.73" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">18K yellow-gold electroplate; 3.5 µm target</text><text x="660.9" y="248.73" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Proposed. Supplier to declare actual stack, process, local minimum and measurement uncertainty.</text><path d="M36 262.46 L1154 262.46" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="262.46" width="1118" height="49.459999999999994" fill="#f1f4f4"/><text x="46" y="282.46" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">M03 / underlayer</text><text x="269.6" y="282.46" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Composition and thickness TBC</text><text x="660.9" y="282.46" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Declare barrier/strike layers; no unapproved substitution. Confirm skin-contact requirements for</text><text x="660.9" y="298.19" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">destination market.</text><path d="M36 311.91999999999996 L1154 311.91999999999996" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="331.91999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">S01 / stones</text><text x="269.6" y="331.91999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">1 × Ø5.00 round brilliant moissanite</text><text x="660.9" y="331.91999999999996" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Proposed material; colourless matched lot. Grade, treatment, origin and profile TBC.</text><path d="M36 345.65 L1154 345.65" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="345.65" width="1118" height="33.73" fill="#f1f4f4"/><text x="46" y="365.65" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">S02 / stone matching</text><text x="269.6" y="365.65" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">2 × Ø2.50 round brilliant moissanite</text><text x="660.9" y="365.65" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Proposed material. Measure girdle, total depth, pavilion and diameter range before seats.</text><path d="M36 379.38 L1154 379.38" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="399.38" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">F01 / findings</text><text x="269.6" y="399.38" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Integrated cast settings</text><text x="660.9" y="399.38" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Any solder/weld filler requires process approval.</text><path d="M36 413.11 L1154 413.11" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="413.11" width="1118" height="33.73" fill="#f1f4f4"/><text x="46" y="433.11" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">Finish / polish</text><text x="269.6" y="433.11" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">High polish on exposed metal; rounded prong tips and contact edges</text><text x="660.9" y="433.11" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Maintain gallery access and local section sizes. Finish sample becomes visual master.</text><path d="M36 446.84000000000003 L1154 446.84000000000003" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="466.84000000000003" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#202b32">Marking / packaging</text><text x="269.6" y="466.84000000000003" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Maker/material mark and location TBC; individually protected</text><text x="660.9" y="466.84000000000003" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#202b32">Verify alloy before marking; include packaging in the quotation.</text><path d="M36 480.57000000000005 L1154 480.57000000000005" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="512.57" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#8b7250" text-anchor="start">MATERIAL CHANGE CONTROL</text><text x="36" y="536.57" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Alternative route: solid 18K yellow gold, without plating; quote separately. Material substitutions require review of casting, setting and finishing requirements.</text><path d="M36 789 L1154 789" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="810" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#53646c" text-anchor="start">02 OCT 2026 / Dimensions in mm / not to scale</text><text x="1154" y="810" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#202b32" text-anchor="end">CF-R01 / SPEC C / 04</text></svg>