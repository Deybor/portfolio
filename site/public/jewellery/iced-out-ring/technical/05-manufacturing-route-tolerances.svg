<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842" style="max-width:100%;height:auto"><title>Iced-out ring / Manufacturing route &amp; tolerances</title><rect width="1190" height="842" fill="white"/><rect x="0" y="0" width="1190" height="62" fill="#202b32"/><text x="36" y="27" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="start">ICED-OUT RING / TECHNICAL SPECIFICATION</text><text x="36" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="start">Adesina Adebola / independent jewellery design study</text><text x="1154" y="27" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="end">IO-R01 / SPEC A</text><text x="1154" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="400" fill="#ffffff" text-anchor="end">SHEET 05 / 08</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#202b32" text-anchor="start">Manufacturing route &amp; tolerances</text><text x="36" y="130.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Proposed manufacturing stages and first-sample acceptance targets.</text><rect x="36" y="165" width="1118" height="30" fill="#202b32"/><text x="46" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Stage / control</text><text x="247.23999999999998" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Requirement</text><text x="694.44" y="185" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="start">Verification / responsibility</text><rect x="36" y="195" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">1 / freeze</text><text x="247.23999999999998" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Confirm alloy, stone purchase profiles, ring size and source units</text><text x="694.44" y="214.5" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Designer + supplier; required before tooling</text><path d="M36 228.015 L1154 228.015" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">2 / pattern</text><text x="247.23999999999998" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Approve a watertight casting master with seat and prong stock matched to purchased</text><text x="247.23999999999998" y="262.53" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">stones</text><text x="694.44" y="247.515" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Supplier to choose compensated scale, resin, orientation, supports and sprues</text><path d="M36 276.04499999999996 L1154 276.04499999999996" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="276.04499999999996" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="295.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">3 / cast / prefinish</text><text x="247.23999999999998" y="295.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Investment cast and prefinish inaccessible galleries</text><text x="694.44" y="295.54499999999996" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Confirm fill, porosity, distortion and remaining section; no blocked cleaning access</text><path d="M36 309.05999999999995 L1154 309.05999999999995" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="328.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">4 / stone set</text><text x="247.23999999999998" y="328.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Measure purchased stones; cut/finish bearings; set and close prongs</text><text x="694.44" y="328.55999999999995" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">No glue as a substitute for mechanical retention; verify every seat</text><path d="M36 342.07499999999993 L1154 342.07499999999993" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="342.07499999999993" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="361.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">5 / finish / plate</text><text x="247.23999999999998" y="361.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Final polish and coating sequence agreed with stone/chemistry compatibility</text><text x="694.44" y="361.57499999999993" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Supplier to document sequence and protect stones; no unapproved coating stack</text><path d="M36 375.0899999999999 L1154 375.0899999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="394.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">T01 / bore</text><text x="247.23999999999998" y="394.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Approved finished bore target ±0.05 mm</text><text x="694.44" y="394.5899999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Proposed; nominal finished bore TBC. Gauge at multiple angles and axial positions.</text><path d="M36 408.1049999999999 L1154 408.1049999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="408.1049999999999" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="427.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">T02 / overall envelope</text><text x="247.23999999999998" y="427.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Approved finished overall envelope ±0.10 mm</text><text x="694.44" y="427.6049999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Proposed; finish allowance/stone height may require revised nominal.</text><path d="M36 441.1199999999999 L1154 441.1199999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="460.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">T03 / stone placement</text><text x="247.23999999999998" y="460.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Stone centre positions ±0.05 mm from approved setting master</text><text x="694.44" y="460.6199999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Proposed; actual stone grading and setter capability must be checked.</text><path d="M36 474.1349999999999 L1154 474.1349999999999" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><rect x="36" y="474.1349999999999" width="1118" height="33.015" fill="#f1f4f4"/><text x="46" y="493.6349999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">T04 / sections / seats</text><text x="247.23999999999998" y="493.6349999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Minimum finished wall, gallery and prong thickness: TBC</text><text x="694.44" y="493.6349999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Set by alloy, casting process and seat geometry.</text><path d="M36 507.14999999999986 L1154 507.14999999999986" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="46" y="526.6499999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="700" fill="#202b32">T05 / plating</text><text x="247.23999999999998" y="526.6499999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">3.5 µm target; local minimum/upper limit TBC after process trial</text><text x="694.44" y="526.6499999999999" font-family="Arial,sans-serif" font-size="10.5" font-weight="400" fill="#202b32">Proposed. Calibrated XRF method and measurement sites must be agreed.</text><path d="M36 540.1649999999998 L1154 540.1649999999998" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="749.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#53646c">Tolerances apply only after a signed sample master exists. Do not shrink or enlarge the production file by an assumed universal percentage. Record tool compensation separately from design dimensions.</text><path d="M36 789 L1154 789" fill="none" stroke="#ccd3d6" stroke-width="0.8"/><text x="36" y="810" font-family="Arial,sans-serif" font-size="9" font-weight="400" fill="#53646c" text-anchor="start">02 OCT 2026 / Dimensions in mm / not to scale</text><text x="1154" y="810" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#202b32" text-anchor="end">IO-R01 / SPEC A / 05</text></svg>